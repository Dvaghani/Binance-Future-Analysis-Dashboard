<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#131B2E" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD535" />
      <stop offset="100%" stop-color="#F0B90B" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#F0B90B" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Binance Top Diamond Accent -->
  <path d="M32 9L37.5 14.5L32 20L26.5 14.5Z" fill="url(#goldGrad)" filter="url(#glow)" />

  <!-- Trading Candlesticks Grid / Chart Graphic -->
  <!-- Left Candlestick (Gold Bull) -->
  <line x1="20" y1="23" x2="20" y2="45" stroke="#F0B90B" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <rect x="17.5" y="28" width="5" height="11" rx="1.5" fill="url(#goldGrad)" />

  <!-- Middle Candlestick (Dominant Emerald Surge) -->
  <line x1="32" y1="21" x2="32" y2="53" stroke="#34D399" stroke-width="2" stroke-linecap="round" />
  <rect x="28.5" y="25" width="7" height="20" rx="2" fill="url(#emeraldGrad)" filter="url(#glow)" />

  <!-- Right Candlestick (Ascending Gold/Emerald Peak) -->
  <line x1="44" y1="18" x2="44" y2="40" stroke="#F0B90B" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <rect x="41.5" y="22" width="5" height="13" rx="1.5" fill="url(#goldGrad)" />

  <!-- Dynamic Trend Curve Accent -->
  <path d="M12 47 C 22 43, 27 34, 52 17" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 3" opacity="0.7"/>
</svg>